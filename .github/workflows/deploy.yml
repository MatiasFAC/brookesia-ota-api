name: Deploy API OTA

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nunca dos despliegues a la vez contra el mismo servidor.
concurrency:
  group: deploy-ota-api
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Desplegar en el servidor Contabo
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Preparar la clave SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Copiar el código al servidor
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # Las opciones se expanden aqui (bash), no en rsync: rsync no usa shell
          # para el -e y no expandiria un "~".
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          TARGET="${DEPLOY_USER}@${DEPLOY_HOST}"
          REMOTE=/srv/apps_matias/ma-brookesia-ota

          ssh $SSH_OPTS "$TARGET" "mkdir -p ${REMOTE}/app ${REMOTE}/cache"
          # El contenedor corre como el usuario 10001 (ver app/Dockerfile): el bind
          # mount del cache tiene que pertenecerle para que pueda escribir.
          ssh $SSH_OPTS "$TARGET" "chown -R 10001:10001 ${REMOTE}/cache"
          rsync -az --delete --exclude '__pycache__' --exclude '.pytest_cache' \
            -e "ssh $SSH_OPTS" app/ "$TARGET:${REMOTE}/app/"
          rsync -az -e "ssh $SSH_OPTS" compose.yml "$TARGET:${REMOTE}/compose.yml"

      - name: Escribir la configuración
        env:
          OTA_UPLOAD_TOKEN: ${{ secrets.OTA_UPLOAD_TOKEN }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          # El .env lleva el token de subida (el que protege POST /upload/<canal>)
          # y queda en el servidor con 0600. El mismo valor lo usa el pipeline de
          # release del firmware para subir los binarios.
          umask 077
          cat > .env <<EOF
          OTA_UPLOAD_TOKEN=${OTA_UPLOAD_TOKEN}
          OTA_PUBLIC_URL=https://ota.m-a.dev
          OTA_CACHE_DIR=/var/cache/brookesia-ota
          OTA_MAX_UPLOAD_BYTES=33554432
          OTA_LOG_LEVEL=INFO
          EOF
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          TARGET="${DEPLOY_USER}@${DEPLOY_HOST}"
          scp $SSH_OPTS .env "$TARGET:/srv/apps_matias/ma-brookesia-ota/.env"
          ssh $SSH_OPTS "$TARGET" "chmod 600 /srv/apps_matias/ma-brookesia-ota/.env"

      - name: Levantar el servicio
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          ssh $SSH_OPTS "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd /srv/apps_matias/ma-brookesia-ota \
             && docker compose up -d --build \
             && docker compose ps"

      - name: Comprobar que responde
        run: |
          # La primera visita tras desplegar dispara la emision del certificado de
          # Let's Encrypt: el primer curl va sin validar (solo para provocar el
          # challenge) y los siguientes ya usan el certificado normal.
          curl -fsS -k --retry 5 --retry-delay 3 --retry-all-errors \
            https://ota.m-a.dev/healthz || true
          curl -fsS --retry 10 --retry-delay 5 --retry-all-errors \
            https://ota.m-a.dev/healthz
          echo
          # El manifiesto da 503 si todavia no hay ningun binario subido: no es
          # un fallo del despliegue, asi que no se hace fallar el pipeline.
          curl -sS --retry 10 --retry-delay 5 --retry-all-errors \
            https://ota.m-a.dev/manifest.json || true
          echo
